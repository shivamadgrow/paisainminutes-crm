<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paisa in Minutes - Apply Now Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="max-w-md w-full bg-white text-slate-800 rounded-3xl p-8 shadow-2xl border border-slate-100">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl">₹</div>
      <div>
        <h2 class="text-xl font-extrabold text-blue-950">Paisa in Minutes</h2>
        <p class="text-xs text-slate-500">Apply for Instant Loan Up to ₹1 Lakh</p>
      </div>
    </div>

    <form id="applyForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Applicant Mobile Number *</label>
        <div class="relative flex items-center">
          <span class="absolute left-4 text-slate-500 font-bold text-sm">+91</span>
          <input 
            type="tel" 
            id="mobileInput"
            placeholder="Enter 10-Digit Mobile Number" 
            maxlength="10"
            required
            class="w-full pl-14 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-2xl text-slate-900 font-bold text-sm focus:ring-2 focus:ring-blue-600 focus:bg-white transition shadow-inner"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
        <input 
          type="text" 
          id="nameInput"
          placeholder="e.g. Shivam" 
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:ring-2 focus:ring-blue-600"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
        <input 
          type="email" 
          id="emailInput"
          placeholder="e.g. example@gmail.com" 
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:ring-2 focus:ring-blue-600"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Required Loan Amount Range</label>
        <select 
          id="amountInput"
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:ring-2 focus:ring-blue-600"
        >
          <option value="₹5,000 - ₹10,000">₹5,000 - ₹10,000</option>
          <option value="₹10,000 - ₹25,000">₹10,000 - ₹25,000</option>
          <option value="₹25,000 - ₹50,000">₹25,000 - ₹50,000</option>
          <option value="₹50,000 - ₹1,000,000">₹50,000 - ₹10,00,000</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Estimated CIBIL Score</label>
        <select 
          id="cibilInput"
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:ring-2 focus:ring-blue-600"
        >
          <option value="750+ (Excellent - Best Approval)">750+ (Excellent - Best Approval)</option>
          <option value="700 - 749 (Good)">700 - 749 (Good)</option>
          <option value="650 - 699 (Fair)">650 - 699 (Fair)</option>
          <option value="Below 650">Below 650</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Pincode</label>
        <input 
          type="text" 
          id="pincodeInput"
          placeholder="110001" 
          value="110001"
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:ring-2 focus:ring-blue-600"
        />
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2 cursor-pointer"
      >
        <span>Check Eligibility & Submit Lead</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </button>
    </form>

    <div id="statusMsg" class="mt-4 hidden p-3 rounded-xl text-xs font-semibold text-center"></div>

    <div class="mt-6 pt-4 border-t border-slate-100 text-[11px] text-slate-400 text-center">
      CRM Live Endpoint: <span class="font-mono text-blue-600">/admin/api/submit-lead</span>
    </div>
  </div>

  <script>
    document.getElementById('applyForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const mobile = document.getElementById('mobileInput').value;
      const name = document.getElementById('nameInput').value;
      const email = document.getElementById('emailInput').value;
      const amount = document.getElementById('amountInput').value;
      const cibil = document.getElementById('cibilInput').value;
      const pincode = document.getElementById('pincodeInput').value;
      const btn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      btn.disabled = true;
      btn.innerText = 'Submitting...';
      statusMsg.className = 'mt-4 p-3 rounded-xl text-xs font-semibold text-center bg-blue-50 text-blue-800 border border-blue-200 block';
      statusMsg.innerText = 'Sending lead to Paisa CRM...';

      try {
        const response = await fetch('/admin/api/submit-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: mobile,
            fullName: name,
            emailAddress: email,
            loanAmount: amount,
            cibilScore: cibil,
            pincode: pincode,
            source: 'Check Eligibility Website (paisainminutes.com)'
          })
        });

        const resData = await response.json();
        if (resData.success) {
          statusMsg.className = 'mt-4 p-3 rounded-xl text-xs font-semibold text-center bg-emerald-50 text-emerald-800 border border-emerald-200 block';
          statusMsg.innerHTML = '✅ Lead Submitted! Lead ID: <strong>' + resData.lead.id + '</strong>. Check CRM Leads view!';
          document.getElementById('applyForm').reset();
        } else {
          statusMsg.className = 'mt-4 p-3 rounded-xl text-xs font-semibold text-center bg-rose-50 text-rose-800 border border-rose-200 block';
          statusMsg.innerText = '❌ Error: ' + (resData.error || 'Failed to submit');
        }
      } catch (err) {
        statusMsg.className = 'mt-4 p-3 rounded-xl text-xs font-semibold text-center bg-rose-50 text-rose-800 border border-rose-200 block';
        statusMsg.innerText = '❌ Request failed: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Check Eligibility & Submit Lead</span>';
      }
    });
  </script>
</body>
</html>
